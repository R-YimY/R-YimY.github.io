<!DOCTYPE html>
<html lang="zh" data-lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <script>document.documentElement.classList.add("js");</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YIMY · 个人主页 | YimY · Portfolio</title>
  <meta name="description" content="YIMY的个人主页:个人简介、主要代码项目与贡献、知识成果等。" />
  <meta name="author" content="YIMY" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">
    <span lang="zh">跳到主要内容</span><span lang="en">Skip to content</span>
  </a>

  <!-- ======================= 导航 ======================= -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="#home" aria-label="Home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name" id="brand-name"></span>
      </a>

      <nav class="nav" id="primary-nav" aria-label="主导航 / Primary">
        <ul>
          <li><a href="#about"><span lang="zh">关于</span><span lang="en">About</span></a></li>
          <li><a href="#projects"><span lang="zh">项目</span><span lang="en">Projects</span></a></li>
          <li><a href="#achievements"><span lang="zh">知识成果</span><span lang="en">Achievements</span></a></li>
          <li><a href="#contact"><span lang="zh">联系</span><span lang="en">Contact</span></a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="btn-ghost" id="lang-toggle" type="button"
                aria-label="切换语言 / Switch language">
          <span id="lang-toggle-label">EN</span>
        </button>
        <button class="btn-ghost btn-icon" id="theme-toggle" type="button"
                aria-label="切换主题 / Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/>
              <line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/>
              <line x1="19.1" y1="4.9" x2="17.3" y2="6.7"/><line x1="6.7" y1="17.3" x2="4.9" y2="19.1"/>
            </g>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" fill="currentColor"/>
          </svg>
        </button>
        <button class="btn-ghost btn-icon nav-toggle" id="nav-toggle" type="button"
                aria-label="菜单 / Menu" aria-expanded="false" aria-controls="primary-nav">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <noscript>
      <div class="container noscript-note">
        <p>本站内容由 <code>data/</code> 目录下的配置文件渲染,需要启用 JavaScript 才能显示。</p>
        <p>This site renders its content from the config files in <code>data/</code>, which requires JavaScript.</p>
      </div>
    </noscript>

    <!-- ======================= Hero 个人简介 ======================= -->
    <section class="hero" id="home">
      <div class="container hero-inner" id="hero-root"></div>
    </section>

    <!-- ======================= 关于我 ======================= -->
    <section class="section" id="about">
      <div class="container" id="about-root"></div>
    </section>

    <!-- ======================= 主要代码项目 ======================= -->
    <section class="section section-alt" id="projects">
      <div class="container" id="projects-root"></div>
    </section>

    <!-- ======================= 知识成果 ======================= -->
    <section class="section section-alt" id="achievements">
      <div class="container" id="achievements-root"></div>
    </section>

    <!-- ======================= 联系 ======================= -->
    <section class="section" id="contact">
      <div class="container" id="contact-root"></div>
    </section>
  </main>

  <!-- ======================= 页脚 ======================= -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p id="footer-copyright"></p>
      <p class="footer-note" id="footer-note"></p>
    </div>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="返回顶部 / Back to top">↑</button>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览 / Image preview" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭 / Close">×</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" src="" alt="" />
      <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- ============ 各板块配置(按需修改这些文件即可) ============ -->
  <script src="data/site.js"></script>
  <script src="data/hero.js"></script>
  <script src="data/about.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/contributions.js"></script>
  <script src="data/achievements.js"></script>
  <script src="data/contact.js"></script>

  <!-- ============ 渲染与交互(一般无需修改) ============ -->
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
